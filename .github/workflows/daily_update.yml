name: NBA Public Media Bot
on:
  schedule:
    # Co 20 minut w godzinach 17:00-08:00 UTC (19:00-10:00 CET)
    # czyli pokrywa wszystkie mecze NBA grane w nocy polskiego czasu
    - cron: '0,20,40 17-23 * * *'   # 17:00-23:59 UTC
    - cron: '0,20,40 0-8  * * *'    # 00:00-08:59 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai pytz

      - name: Run ESPN Media Model
        run: python update_nba.py

      - name: Run Gemini Audit (Risk Check)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_audit.py

      - name: Commit and Push
        run: |
          git config --global user.name 'ESPN Bot'
          git config --global user.email 'bot@espn.nba'

          [ -f index.html ]               && git add index.html
          [ -f finalny_raport_dnia.txt ]  && git add finalny_raport_dnia.txt
          [ -f propozycje_typow.txt ]     && git add propozycje_typow.txt
          [ -f sitemap.xml ]              && git add sitemap.xml
          [ -f robots.txt ]               && git add robots.txt
          [ -d archive ]                  && git add archive/

          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "NBA Update $(date -u +%H:%M UTC)" && git push)
