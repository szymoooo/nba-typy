name: Fix Archive
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run fix_archive.py
        run: python fix_archive.py
      - name: Commit and Push
        run: |
          git config --global user.name 'Fix Bot'
          git config --global user.email 'bot@fix.com'
          [ -d archive ] && git add archive/
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Fix archive: GA4 + paths" && git push)
