    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --border: #334155;
            --nba: #3b82f6;

            --plk: #dc2626;
            --lba: #006db7;
            --acb: #c8102e;
            --bbl: #e30613;
        }
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 60%);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 20px;
        }
        .hub-container { max-width: 1400px; margin: 0 auto; width: 100%; }
        .hub-header { text-align: center; margin-bottom: 60px; }
        .hub-title {
            font-weight: 900;
            letter-spacing: -2px;
            margin: 0 0 12px;
            font-size: 3.5rem;
            background: linear-gradient(120deg, var(--nba) 0%, var(--euroleague) 50%, var(--plk) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hub-tagline {
            color: var(--subtext);
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }
        .hub-tagline .basketball { font-size: 1.4rem; vertical-align: middle; margin: 0 8px; }
        .league-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        .league-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 40px 24px;
            min-height: 320px;
            color: var(--text);
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }
        .league-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.03) 100%);
            pointer-events: none;
        }
        .league-card:hover { transform: translateY(-6px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .league-card.nba:hover    { border-color: var(--nba);        box-shadow: 0 25px 50px -12px rgba(59,130,246,0.35); }
        .league-card.euroleague:hover { border-color: var(--euroleague); box-shadow: 0 25px 50px -12px rgba(255,102,0,0.35); }
        .league-card.plk:hover    { border-color: var(--plk);        box-shadow: 0 25px 50px -12px rgba(220,38,38,0.35); }
        .league-card.lba:hover    { border-color: var(--lba);        box-shadow: 0 25px 50px -12px rgba(0,109,183,0.35); }
        .league-card.acb:hover    { border-color: var(--acb);        box-shadow: 0 25px 50px -12px rgba(200,16,46,0.35); }
        .league-card.bbl:hover    { border-color: var(--bbl);        box-shadow: 0 25px 50px -12px rgba(227,6,19,0.35); }
        .league-logo {
            width: 140px; height: 140px; object-fit: contain; margin-bottom: 24px;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
            transition: transform 0.25s;
        }
        .league-card:hover .league-logo { transform: scale(1.05); }
        .league-name { font-weight: 900; font-size: 1.8rem; letter-spacing: -1px; margin: 0 0 8px; }
        .league-card.nba .league-name        { color: var(--nba); }
        .league-card.euroleague .league-name { color: var(--euroleague); }
        .league-card.plk .league-name        { color: var(--plk); }
        .league-card.lba .league-name        { color: var(--lba); }
        .league-card.acb .league-name        { color: var(--acb); }
        .league-card.bbl .league-name        { color: var(--bbl); }
        .league-sub {
            color: var(--subtext); font-size: 0.8rem; text-transform: uppercase;
            letter-spacing: 1.5px; font-weight: 700; text-align: center; margin: 0 0 20px;
        }
        .league-cta {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px 24px; font-weight: 800; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1.5px; transition: background 0.2s, border-color 0.2s;
        }
        .league-card.nba:hover .league-cta        { background: rgba(59,130,246,0.15);  border-color: var(--nba); }
        .league-card.euroleague:hover .league-cta { background: rgba(255,102,0,0.15);   border-color: var(--euroleague); }
        .league-card.plk:hover .league-cta        { background: rgba(220,38,38,0.15);   border-color: var(--plk); }
        .league-card.lba:hover .league-cta        { background: rgba(0,109,183,0.15);   border-color: var(--lba); }
        .league-card.acb:hover .league-cta        { background: rgba(200,16,46,0.15);   border-color: var(--acb); }
        .league-card.bbl:hover .league-cta        { background: rgba(227,6,19,0.15);    border-color: var(--bbl); }
        .hub-footer {
            text-align: center; color: var(--subtext); font-size: 0.75rem; margin-top: 50px;
        }
        .hub-footer a {
            color: var(--subtext); text-decoration: none; border-bottom: 1px dotted var(--border);
        }
        .hub-footer a:hover { color: var(--text); }
        @media (max-width: 1100px) { .league-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {

            .league-card { min-height: 260px; padding: 32px 20px; }
            .league-logo { width: 110px; height: 110px; margin-bottom: 18px; }
            .league-name { font-size: 1.5rem; }
        }
