
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Leki</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>Moje Leki</h1>
    <div class="sub-container">
        <div class="section" id="planowanie">
            <h2>Planowanie</h2>
            <button class="button-icon" onclick="openModal()">
                <img src="images/pil.png" alt="Ikona planowania">
            </button>
            <div id="lek-lista-container"></div>
            <div id="pagination-controls">
                <button onclick="previousPage()" disabled id="prev-btn">Poprzednia</button>
                <button onclick="nextPage()" disabled id="next-btn">Następna</button>
            </div>
        </div>
        <div class="section" id="historyczne">
            <h2>Historyczne</h2>
            <div id="historyczne-lek-lista-container"></div>
            <div id="pagination-controls-historyczne">
                <button onclick="previousPageHistoryczne()" disabled id="prev-btn-historyczne">Poprzednia</button>
                <button onclick="nextPageHistoryczne()" disabled id="next-btn-historyczne">Następna</button>
            </div>
        </div>
    </div>
</div>
<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Dodaj Lek</h2>
        <form id="lekForm">
            <label for="nazwa">Nazwa leku</label>
            <input type="text" id="nazwa" name="nazwa" required>
            <label for="typ">Typ leku</label>
            <select id="typ" name="typ" onchange="toggleFields()" required>
                <option value="">Proszę wybrać</option>
                <option value="tabletka">Tabletka</option>
                <option value="syrop">Syrop</option>
            </select>
            <div id="dawka-container" style="display:none;">
                <label for="dawka">Dawka (tabletki)</label>
                <input type="number" id="dawka" name="dawka" min="0.25" step="0.25" placeholder="Podaj dawkę" required>
            </div>
            <div id="syrop-container" style="display:none;">
                <label for="syrop">Dawka (ml)</label>
                <input type="number" id="syrop" name="syrop" min="25" step="5" placeholder="Wartość w ml" required>
            </div>
            <label for="czestotliwosc">Częstotliwość zażywania</label>
            <select id="czestotliwosc" name="czestotliwosc" required>
                <option value="">Proszę wybrać</option>
                <option value="1">1 godzina</option>
                <option value="2">2 godziny</option>
                <option value="3">3 godziny</option>
                <option value="6">6 godzin</option>
                <option value="8">8 godzin</option>
                <option value="12">12 godzin</option>
            </select>
            <button type="submit">Zapisz</button>
        </form>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
